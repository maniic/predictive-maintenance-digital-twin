[project]
name = "predictive-maintenance-digital-twin"
version = "0.1.0"
description = "A digital twin ML system for predictive maintenance using NASA C-MAPSS turbofan engine data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abdullah Chabaytah" }]

# Runtime dependencies. Lower bounds are the oldest version the code is known to
# work with; upper bounds keep a clone months from now on a compatible major.
dependencies = [
    # Data processing
    "pandas>=2.0.0,<4",
    "numpy>=1.24.0,<3",

    # Machine learning
    "scikit-learn>=1.3.0,<2",
    "torch>=2.0.0,<3",
    "pytorch-lightning>=2.0.0,<3",

    # Utilities
    "pyyaml>=6.0.0,<7",
]

[project.optional-dependencies]
# Experiment tracking. Optional: training runs without it (--no-mlflow).
tracking = ["mlflow>=2.9.0,<4"]

# Explainability and plotting. Required by src.evaluation.explainability only.
explain = [
    "shap>=0.43.0,<1",
    "matplotlib>=3.7.0,<4",
]

dev = [
    "pytest>=7.4.0,<10",
    "pytest-cov>=4.1.0,<8",
    "ruff>=0.1.0,<1",
]

[project.urls]
Homepage = "https://github.com/maniic/predictive-maintenance-digital-twin"
Dashboard = "https://maniic.github.io/predictive-maintenance-digital-twin/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable package is `src`, which does not match the project name, so
# hatchling needs to be told explicitly. Without this, `pip install -e .` fails.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
