name: CI

on:
  # Every branch, not just main: a feature branch gets feedback before a pull
  # request exists. The concurrency group below cancels superseded runs.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only wheels: the CUDA build is roughly 2 GB and nothing here
          # needs a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Verify the committed C-MAPSS data
        run: python scripts/fetch_data.py --verify

      - name: Run tests
        run: pytest -q --cov=src --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: Check
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Catches a broken dashboard here rather than in the Pages deploy, which
      # only runs after a merge to main.
      - name: Install
        working-directory: web
        run: npm ci

      - name: Format check
        working-directory: web
        run: npm run format:check

      - name: Build (server mode, includes API routes)
        working-directory: web
        run: npm run build

      - name: Build (static export, what GitHub Pages serves)
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static
